apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerpulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: powerpulse-frontend
  template:
    metadata:
      labels:
        app: powerpulse-frontend
    spec:
      containers:
      - name: frontend
        image: uniquecontainerregistry01.azurecr.io/powerpulse:__TAG__
        ports:
          - containerPort: 80
        envFrom:
          - configMapRef:
              name: frontend-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"