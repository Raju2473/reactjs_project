trigger:
- main

variables:
  imageName: powerpulse

stages:
# ================= CI STAGE =================
- stage: Build
  displayName: Build and Push Image to ACR
  jobs:
  - job: Build
    displayName: Build Docker Image
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    
    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: '20.x'

    - script: npm ci
      displayName: Install dependencies

    - script: npm test
      displayName: Run tests

    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        command: buildAndPush
        containerRegistry: containerRegistry  # Docker Registry service connection
        repository: powerpulse
        dockerfile: Dockerfile
        tags: |
          $(Build.BuildId)

# ================= CD STAGE =================
# - stage: Deploy
#   displayName: Deploy to AKS
#   dependsOn: Build
#   jobs:
#   - job: Deploy
#     displayName: Deploy to Kubernetes
#     pool:
#       vmImage: ubuntu-latest
#     steps:
#     - task: Kubernetes@1
#       displayName: Apply Kubernetes Manifests
#       inputs:
#         connectionType: 'Kubernetes Service Connection'
#         kubernetesServiceEndpoint: aks-arm-kuber   # Kubernetes service connection
#         namespace: default
#         command: apply
#         useConfigurationFile: true
#         configuration: k8s/

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: Deploy
    pool:
      vmImage: ubuntu-latest
    steps:

    - task: Bash@3
      displayName: Replace image tag in Deployment
      inputs:
        targetType: inline
        script: |
          echo "Replacing image tag with $(Build.BuildId)"
          sed -i "s/__TAG__/$(Build.BuildId)/g" k8s/deployment.yaml
          cat k8s/deployment.yaml

    - task: Kubernetes@1
      displayName: Apply Kubernetes Manifests
      inputs:
        connectionType: Kubernetes Service Connection
        kubernetesServiceEndpoint: kubernates
        namespace: default
        command: apply
        useConfigurationFile: true
        configuration: k8s/
